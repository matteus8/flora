name: Platform STAQ - Zarf Package Orchestrator

# -----------------------------------------------------------------------------
# LOGICAL FLOW:
# 1. SECURE MODEL BUILD: Hardens the GGUF model into a Docker image
# 2. ZARF PACKAGE BUILD: Packages K8s manifests/charts into Zarf OCI artifacts
# 3. OCI PUBLISH: Pushes packages to Amazon ECR (on main / release tags)
# 4. GITHUB RELEASE: Generates GitHub Release when a version tag is pushed
# -----------------------------------------------------------------------------

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'release/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

env:
  ZARF_VERSION: "v0.88.0"
  AWS_REGION: "us-east-2"
  AWS_ACCOUNT_ID: "973213517498"
  ECR_REGISTRY: "973213517498.dkr.ecr.us-east-2.amazonaws.com"
  # Base path for Zarf OCI artifacts
  OCI_BASE: "oci://973213517498.dkr.ecr.us-east-2.amazonaws.com/airgap-ai-testing/flora"
  AWS_ROLE_ARN: "arn:aws:iam::973213517498:role/githubActions-s3-put-artifacts01"
  
  # MODEL CONFIGURATION
  MODEL_URL: "https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q2_K.gguf"
  MODEL_FILENAME: "artifact-model.gguf"
  MODEL_IMAGE: "973213517498.dkr.ecr.us-east-2.amazonaws.com/airgap-ai-testing/flora/models/tinyllama"
  MODEL_TAG: "1.1b-v2"
  IDE_ARTIFACT_DIR: "packages/03-staq-ide/build-artifacts"

jobs:
  secure-build-model:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Cache AI Model Artifacts
        id: cache-model
        uses: actions/cache@v5
        with:
          path: ${{ env.IDE_ARTIFACT_DIR }}/${{ env.MODEL_FILENAME }}
          key: model-tinyllama-1.1b

      - name: Setup Python & Audit Tool
        run: |
          python3 -m pip install modelaudit --no-cache-dir --quiet
          mkdir -p ${{ env.IDE_ARTIFACT_DIR }}

      - name: Download & Scan Model
        run: |
          TARGET_PATH="${{ env.IDE_ARTIFACT_DIR }}/${{ env.MODEL_FILENAME }}"
          if [ ! -f "$TARGET_PATH" ]; then
            echo "Downloading Model..."
            curl -fL "${{ env.MODEL_URL }}" -o "$TARGET_PATH"
          fi
          # Ensure reproducible timestamps
          touch -t 202401010000 "$TARGET_PATH"
          # Perform Security Scan
          modelaudit scan "$TARGET_PATH" --strict --sbom ${{ env.IDE_ARTIFACT_DIR }}/model-sbom.json --format json
          
          sha256sum "$TARGET_PATH" > ${{ env.IDE_ARTIFACT_DIR }}/image-integrity.txt

      - name: Configure AWS Credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Model Container Image
        run: |
          docker build \
            -f packages/03-staq-ide/Dockerfile.model \
            -t ${{ env.MODEL_IMAGE }}:${{ env.MODEL_TAG }} \
            ${{ env.IDE_ARTIFACT_DIR }}

      - name: Ensure Model ECR Repository Exists
        if: github.event_name != 'pull_request'
        run: |
          REPO_NAME="airgap-ai-testing/flora/models/tinyllama"
          echo "Checking ECR repository: $REPO_NAME"
          aws ecr describe-repositories --repository-names "$REPO_NAME" --region ${{ env.AWS_REGION }} >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$REPO_NAME" --region ${{ env.AWS_REGION }} --image-scanning-configuration scanOnPush=true || true

      - name: Push Model Image to ECR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.MODEL_IMAGE }}:${{ env.MODEL_TAG }}

      - name: Upload Build Artifacts for Zarf
        uses: actions/upload-artifact@v4
        with:
          name: staq-ide-artifacts
          path: ${{ env.IDE_ARTIFACT_DIR }}/
          retention-days: 1

  publish-zarf-packages:
    needs: [secure-build-model]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package-path: [
          "packages/01-staq-core",
          "packages/02a-staq-gitlab",
          "packages/02b-staq-factory",
          "packages/03-staq-ide",
          # "packages/04-staq-custom"
        ]
    steps:
      - uses: actions/checkout@v6

      - name: Download Build Artifacts (IDE only)
        if: matrix.package-path == 'packages/03-staq-ide'
        uses: actions/download-artifact@v4
        with:
          name: staq-ide-artifacts
          path: ${{ env.IDE_ARTIFACT_DIR }}

      - name: Install Zarf
        run: |
          curl -sL "https://github.com/zarf-dev/zarf/releases/download/${{ env.ZARF_VERSION }}/zarf_${{ env.ZARF_VERSION }}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf

      - name: Configure AWS Credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set Version
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate Package (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          echo "Linting package definition for ${{ matrix.package-path }}..."
          zarf dev lint ${{ matrix.package-path }} --set PACKAGE_VERSION="${{ steps.vars.outputs.VERSION }}"
          echo "Testing local build for ${{ matrix.package-path }}..."
          zarf package create ${{ matrix.package-path }} \
            --set PACKAGE_VERSION="${{ steps.vars.outputs.VERSION }}" \
            --output . \
            --skip-sbom \
            --confirm

      - name: Ensure Package ECR Repository Exists
        if: github.event_name != 'pull_request'
        run: |
          PKG_DIR="${{ matrix.package-path }}"
          PKG_NAME=$(grep -E "^  name: " "$PKG_DIR/zarf.yaml" | head -n 1 | awk '{print $2}' | tr -d '"')
          REPO_NAME="airgap-ai-testing/flora/${PKG_NAME}"
          echo "Checking ECR repository: $REPO_NAME"
          aws ecr describe-repositories --repository-names "$REPO_NAME" --region ${{ env.AWS_REGION }} >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$REPO_NAME" --region ${{ env.AWS_REGION }} --image-scanning-configuration scanOnPush=true || true

      - name: Zarf Login & Publish to ECR
        if: github.event_name != 'pull_request'
        run: |
          # Log Zarf into ECR
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | zarf tools registry login ${{ env.ECR_REGISTRY }} -u AWS --password-stdin
          
          # Create and Publish package directly to ECR as an OCI artifact
          zarf package create ${{ matrix.package-path }} \
            --set PACKAGE_VERSION="${{ steps.vars.outputs.VERSION }}" \
            --output ${{ env.OCI_BASE }} \
            --skip-sbom \
            --confirm

  create-release:
    needs: [publish-zarf-packages]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Platform STAQ Release ${{ github.ref_name }}
          generate_release_notes: true
