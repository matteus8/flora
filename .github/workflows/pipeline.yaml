name: Platform STAQ - Model & CLI Orchestrator

# -----------------------------------------------------------------------------
# LOGICAL FLOW DESCRIPTION:
#
# 1. QUALITY & SECURITY GATE (Prerequisites):
#    - Validates AI Model integrity via 'modelaudit'.
#    - Builds a hardened Docker image containing the GGUF model.
#    - Conditional execution: Skips model builds if only documentation changes.
#
# 2. SEMANTIC VERSIONING & RELEASE (Release Strategy):
#    - Logic: Uses Git Tags (v*) for production releases, or Short SHA for dev builds.
#    - Compiles the Go-based CLI and packages it via Zarf OCI artifacts.
#
# 3. SECURE CLOUD INTEGRATION (AWS Auth):
#    - Uses GitHub OIDC to assume an AWS IAM Role (no static AWS keys).
#    - Pushes artifacts to Amazon ECR.
#
# 4. DOCUMENTATION & PAGES (Website):
#    - Builds the Node.js documentation site.
#    - Deploys automatically to GitHub Pages on main branch updates.
# -----------------------------------------------------------------------------

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  # GLOBAL SETTINGS
  ZARF_VERSION: "v0.67.0"
  AWS_REGION: "us-east-2"
  AWS_ACCOUNT_ID: "973213517498"
  ECR_REGISTRY: "973213517498.dkr.ecr.us-east-2.amazonaws.com"
  CI_REGISTRY_IMAGE: "973213517498.dkr.ecr.us-east-2.amazonaws.com/airgap-ai-testing/flora"
  
  # MODEL CONFIGURATION
  MODEL_URL: "https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q2_K.gguf"
  MODEL_FILENAME: "artifact-model.gguf"
  MODEL_IMAGE: "973213517498.dkr.ecr.us-east-2.amazonaws.com/airgap-ai-testing/flora/models/tinyllama"
  MODEL_TAG: "1.1b-v2"
  IDE_ARTIFACT_DIR: "packages/03-staq-ide/build-artifacts"

jobs:
  # ===========================================================================
  # JOB 1: SECURE MODEL BUILD
  # ===========================================================================
  secure-build-model:
    runs-on: ubuntu-latest
    # Required for AWS OIDC Auth
    permissions:
      id-token: write
      contents: read
    # Mirroring GitLab logic: Skip if ONLY docs changed
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'docs:')
    steps:
      - uses: actions/checkout@v6

      - name: Cache AI Model Artifacts
        id: cache-model
        uses: actions/cache@v5
        with:
          path: ${{ env.IDE_ARTIFACT_DIR }}/${{ env.MODEL_FILENAME }}
          key: model-tinyllama-1.1b

      - name: Setup Python & Audit Tool
        run: |
          python3 -m pip install modelaudit --no-cache-dir --quiet
          mkdir -p ${{ env.IDE_ARTIFACT_DIR }}

      - name: Download & Scan Model
        run: |
          TARGET_PATH="${{ env.IDE_ARTIFACT_DIR }}/${{ env.MODEL_FILENAME }}"
          if [ ! -f "$TARGET_PATH" ]; then
            echo "Downloading Model..."
            curl -fL "${{ env.MODEL_URL }}" -o "$TARGET_PATH"
          fi
          # Ensure reproducible timestamps
          touch -t 202401010000 "$TARGET_PATH"
          # Perform Security Scan
          modelaudit scan "$TARGET_PATH" --strict --sbom ${{ env.IDE_ARTIFACT_DIR }}/model-sbom.json --format json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Model Image
        run: |
          docker pull ${{ env.MODEL_IMAGE }}:${{ env.MODEL_TAG }} || true
          docker build \
            --cache-from ${{ env.MODEL_IMAGE }}:${{ env.MODEL_TAG }} \
            -f packages/03-staq-ide/Dockerfile.model \
            -t ${{ env.MODEL_IMAGE }}:${{ env.MODEL_TAG }} .
          docker push ${{ env.MODEL_IMAGE }}:${{ env.MODEL_TAG }}
          
          echo "Model Image Digest:" > ${{ env.IDE_ARTIFACT_DIR }}/image-integrity.txt
          docker inspect --format='{{.RepoDigests}}' ${{ env.MODEL_IMAGE }}:${{ env.MODEL_TAG }} >> ${{ env.IDE_ARTIFACT_DIR }}/image-integrity.txt

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: security-artifacts
          path: ${{ env.IDE_ARTIFACT_DIR }}/
          retention-days: 1

  # ===========================================================================
  # JOB 2: PRODUCE RELEASE (Go & Zarf)
  # ===========================================================================
  produce-release:
    needs: [secure-build-model]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Install Zarf & AWS CLI
        run: |
          curl -sL "https://github.com/zarf-dev/zarf/releases/download/${{ env.ZARF_VERSION }}/zarf_${{ env.ZARF_VERSION }}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Set Version Logic
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Build OCI Release
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | zarf tools registry login ${{ env.ECR_REGISTRY }} -u AWS --password-stdin
          make release-oci VERSION="${{ steps.vars.outputs.VERSION }}" REGISTRY=${{ env.CI_REGISTRY_IMAGE }}

      - name: Upload CLI Binaries
        uses: actions/upload-artifact@v6
        with:
          name: staq-cli-${{ steps.vars.outputs.VERSION }}
          path: dist/platformstaq-v*/staq

  # ===========================================================================
  # JOB 3: DOCUMENTATION (GitHub Pages)
  # ===========================================================================
  documentation:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, 'docs:')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Build Site
        run: |
          cd cli-docs
          npm ci
          npm run build
      
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cli-docs/public

  deploy-docs:
    needs: documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ===========================================================================
  # JOB 4: GITHUB RELEASE PAGE
  # ===========================================================================
  create-release:
    needs: [produce-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      
      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: staq-cli-*
          merge-multiple: true
          path: release-assets

      - name: Generate Release Notes
        run: |
          cat <<EOF > release_notes.md
          ## Platform STAQ Release ${{ github.ref_name }}
          
          ### Installation
          1. **Download** the \`staq\` CLI from assets.
          2. **Login** to ECR:
             \`\`\`bash
             aws ecr get-login-password --region ${{ env.AWS_REGION }} | ./staq tools registry login ${{ env.CI_REGISTRY_IMAGE }} -u AWS --password-stdin
             \`\`\`
          3. **Deploy**:
             \`\`\`bash
             ./staq deploy oci://${{ env.CI_REGISTRY_IMAGE }}/staq-core:${{ github.ref_name }}
             \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: release-assets/**/*
          tag_name: ${{ github.ref_name }}