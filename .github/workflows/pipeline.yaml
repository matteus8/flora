name: Platform STAQ - Zarf Package Orchestrator

# -----------------------------------------------------------------------------
# LOGICAL FLOW:
# 1. SECURE MODEL BUILD: Hardens the GGUF model into a Docker image & pushes to GHCR
# 2. ZARF PACKAGE BUILD: Packages K8s manifests/charts into Zarf OCI artifacts
# 3. OCI PUBLISH: Pushes packages directly to GHCR (on main / release tags)
# 4. GITHUB RELEASE: Generates GitHub Release when a version tag is pushed
# -----------------------------------------------------------------------------

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'release/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

env:
  ZARF_VERSION: "v0.88.0"
  REGISTRY: "ghcr.io"
  OCI_BASE: "oci://ghcr.io/matteus8/flora"
  MODEL_IMAGE: "ghcr.io/matteus8/flora/models/tinyllama"
  MODEL_TAG: "1.1b-v2"
  MODEL_URL: "https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q2_K.gguf"
  MODEL_FILENAME: "artifact-model.gguf"
  IDE_ARTIFACT_DIR: "packages/03-staq-ide/build-artifacts"

jobs:
  secure-build-model:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Cache AI Model Artifacts
        id: cache-model
        uses: actions/cache@v5
        with:
          path: ${{ env.IDE_ARTIFACT_DIR }}/${{ env.MODEL_FILENAME }}
          key: model-tinyllama-1.1b

      - name: Setup Python & Audit Tool
        run: |
          python3 -m pip install modelaudit --no-cache-dir --quiet
          mkdir -p ${{ env.IDE_ARTIFACT_DIR }}

      - name: Download & Scan Model
        run: |
          TARGET_PATH="${{ env.IDE_ARTIFACT_DIR }}/${{ env.MODEL_FILENAME }}"
          if [ ! -f "$TARGET_PATH" ]; then
            echo "Downloading Model..."
            curl -fL "${{ env.MODEL_URL }}" -o "$TARGET_PATH"
          fi
          # Ensure reproducible timestamps
          touch -t 202401010000 "$TARGET_PATH"
          # Perform Security Scan
          modelaudit scan "$TARGET_PATH" --strict --sbom ${{ env.IDE_ARTIFACT_DIR }}/model-sbom.json --format json
          
          sha256sum "$TARGET_PATH" > ${{ env.IDE_ARTIFACT_DIR }}/image-integrity.txt

      - name: Build Model Container Image
        run: |
          docker build \
            -f packages/03-staq-ide/Dockerfile.model \
            -t ${{ env.MODEL_IMAGE }}:${{ env.MODEL_TAG }} \
            ${{ env.IDE_ARTIFACT_DIR }}

      - name: Login to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Model Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.MODEL_IMAGE }}:${{ env.MODEL_TAG }}

      - name: Upload Build Artifacts for Zarf
        uses: actions/upload-artifact@v4
        with:
          name: staq-ide-artifacts
          path: ${{ env.IDE_ARTIFACT_DIR }}/
          retention-days: 1

  publish-zarf-packages:
    needs: [secure-build-model]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package-path: [
          "packages/01-staq-core",
          "packages/02a-staq-gitlab",
          "packages/02b-staq-factory",
          "packages/03-staq-ide",
          # "packages/04-staq-custom"
        ]
    steps:
      - uses: actions/checkout@v6

      - name: Download Build Artifacts (IDE only)
        if: matrix.package-path == 'packages/03-staq-ide'
        uses: actions/download-artifact@v4
        with:
          name: staq-ide-artifacts
          path: ${{ env.IDE_ARTIFACT_DIR }}

      - name: Install Zarf
        run: |
          curl -sL "https://github.com/zarf-dev/zarf/releases/download/${{ env.ZARF_VERSION }}/zarf_${{ env.ZARF_VERSION }}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf

      - name: Set Version
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate Package (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          echo "Linting package definition for ${{ matrix.package-path }}..."
          zarf dev lint ${{ matrix.package-path }} --set PACKAGE_VERSION="${{ steps.vars.outputs.VERSION }}"
          echo "Testing local build for ${{ matrix.package-path }}..."
          zarf package create ${{ matrix.package-path }} \
            --set PACKAGE_VERSION="${{ steps.vars.outputs.VERSION }}" \
            --output . \
            --skip-sbom \
            --confirm

      - name: Zarf Login & Publish to GHCR
        if: github.event_name != 'pull_request'
        run: |
          # Log Zarf into GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | zarf tools registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          
          # Create and Publish package directly to GHCR as an OCI artifact
          zarf package create ${{ matrix.package-path }} \
            --set PACKAGE_VERSION="${{ steps.vars.outputs.VERSION }}" \
            --output ${{ env.OCI_BASE }} \
            --skip-sbom \
            --confirm

  create-release:
    needs: [publish-zarf-packages]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Platform STAQ Release ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            Platform STAQ ${{ github.ref_name }} provides a hardened, air-gap-ready DevOps and AI workspace suite built on Zarf. This release packages certified Helm charts, Gateway API networking, DevSecOps factory tooling, and a containerized AI code-server environment for disconnected and regulated Kubernetes clusters.

            | Package / Service | Component | Chart Version | App / Image Version |
            | :--- | :--- | :--- | :--- |
            | **01-staq-core** | Traefik Ingress Controller | `42.1.3` | `v3.7.16` |
            | **01-staq-core** | Kubernetes Gateway API CRDs | Standard Channel | `v1.6.3` |
            | **01-staq-core** | Cert-Manager | `v1.21.3` | `v1.21.3` |
            | **01-staq-core** | Kube-Prometheus-Stack | `92.14.1` | Prometheus `v3.15.1` / Grafana `13.2.4` |
            | **01-staq-core** | Logging Stack (Loki & Promtail) | Loki `7.5.0` / Promtail `6.17.1` | Loki `3.6.11` / Promtail `3.5.1` |
            | **02a-staq-gitlab** | GitLab Community Edition | `9.11.14` | `v18.11.13` (Runner `v18.11.2`, PG `16.6.0`, Redis `7.2.4`, MinIO) |
            | **02b-staq-factory** | ArgoCD | `10.11.6` | `v3.5.6` |
            | **02b-staq-factory** | SonarQube | `2026.5.1003` | `26.9.0-community` |
            | **02b-staq-factory** | Sonatype Nexus 3 | `64.2.0` | `3.97.3` |
            | **02b-staq-factory** | Harbor Container Registry | `1.19.4` | `2.15.4` (Trivy scanner, Valkey cache) |
            | **03-staq-ide** | Code-Server (VS Code IDE) | `3.0.0` | `4.100.0` |
            | **03-staq-ide** | Chatbot (Ollama AI Backend) | `1.92.0` | `0.40.11` |
            | **03-staq-ide** | Open WebUI Frontend | `17.0.0` | `0.12.0` |
            | **03-staq-ide** | AI Language Model | GGUF Container | TinyLlama-1.1B-Chat-v1.0 (`1.1b-v2`) |
            | **04-staq-custom** | User Bespoke Stack | Template | Custom cherry-picked components |

            ### Quickstart: Download & Deploy Packages

            1. **Authenticate to GitHub Container Registry (GHCR):**
               ```bash
               echo "<GITHUB_PAT>" | zarf tools registry login ghcr.io -u <GITHUB_USERNAME> --password-stdin
               ```
            2. **Pull the air-gap package archives (on an internet-connected workstation):**
               ```bash
               zarf package pull oci://ghcr.io/matteus8/flora/staq-core:${{ github.ref_name }}
               zarf package pull oci://ghcr.io/matteus8/flora/staq-gitlab:${{ github.ref_name }}
               zarf package pull oci://ghcr.io/matteus8/flora/staq-factory:${{ github.ref_name }}
               zarf package pull oci://ghcr.io/matteus8/flora/staq-ide:${{ github.ref_name }}
               ```
            3. **Transfer the resulting `.tar.zst` files into the disconnected air-gap network.**
            4. **Initialize and deploy into the target Kubernetes cluster:**
               ```bash
               zarf init --confirm
               zarf package deploy zarf-package-staq-core-*.tar.zst --confirm
               zarf package deploy zarf-package-staq-ide-*.tar.zst --confirm
               ```
