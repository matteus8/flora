kind: ZarfPackageConfig
metadata:
  name: factory-nexus
  version: "###ZARF_PKG_TMPL_PACKAGE_VERSION###"
  description: "Artifact Proxy"

variables:
  - name: PACKAGE_VERSION
    default: "0.0.1"

components:
  - name: nexus
    required: true
    manifests:
      - name: nexus-http-route
        namespace: nexus
        files:
          - ./manifests/httproute.yaml
    charts:
      - name: nexus-repository-manager
        url: https://sonatype.github.io/helm3-charts/
        version: "64.2.0"
        namespace: nexus
        valuesFiles:
          - ./overrides/values.yaml
    images:
      - docker.io/sonatype/nexus3:3.97.3
