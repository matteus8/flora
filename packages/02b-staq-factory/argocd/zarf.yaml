kind: ZarfPackageConfig
metadata:
  name: factory-argocd
  version: "###ZARF_PKG_TMPL_PACKAGE_VERSION###"
  description: "GitOps Continuous Delivery"

variables:
  - name: PACKAGE_VERSION
    default: "0.0.1"

components:
  - name: argocd
    required: true
    description: "Argo CD GitOps Engine"
    manifests:
      - name: argocd-http-route
        namespace: argocd
        files:
          - ./manifests/httproute.yaml
    charts:
      - name: argo-cd
        url: https://argoproj.github.io/argo-helm
        version: "10.11.6"
        namespace: argocd
        valuesFiles:
          - ./overrides/values.yaml
    images:
      - ghcr.io/dexidp/dex:v2.46.1
      - public.ecr.aws/docker/library/redis:7.2.4-alpine
      - quay.io/argoproj/argocd:v3.5.6
      - quay.io/argoproj/argocd:sha256-8e5cc5bb008df8a09dba439462e58c94c55b7735888d3ebde0c25fc05e4e5335.att
