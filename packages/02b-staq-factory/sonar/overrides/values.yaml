# ----------------------------------------------------------------------------
# 1. FIX: MANDATORY MONITORING PASSCODE
# ----------------------------------------------------------------------------
# The chart requires this to be set for liveness/readiness probes to function.
monitoringPasscode: "change-me-to-a-secure-passcode"

# ----------------------------------------------------------------------------
# 2. NETWORK CONFIGURATION: DISABLE INGRESS / ENABLE GATEWAY API
# ----------------------------------------------------------------------------

# Disable standard Ingress and OpenShift Routes
ingress:
  enabled: false

ingress-nginx:
  enabled: false

OpenShift:
  route:
    enabled: false

# Enable Gateway API (HTTPRoute)
httproute:
  enabled: true
  
  # Name of your Traefik Gateway resource
  # Ensure this matches the Gateway created in your 'common' package
  gateway: main-gateway 
  
  # Namespace where the Gateway resource lives
  gatewayNamespace: traefik
  
  # Hostname for routing
  hostnames:
    - sonarqube.local
  
  # (Optional) Rules are usually auto-generated by the chart based on service
  # defaults, but you can override them here if needed.
  # rules: []

httproute:
  enabled: false 

image:
  tag: 25.9.0.112764-community
  pullPolicy: IfNotPresent

# ----------------------------------------------------------------------------
# 3. DATABASE CONFIGURATION
# ----------------------------------------------------------------------------
# By default, this uses an embedded PostgreSQL. 
# If you need external DB, set enabled: false and configure jdbcOverwrite.
postgresql:
  enabled: true
  postgresqlUsername: "sonarUser"
  postgresqlPassword: "sonarPass"
  postgresqlDatabase: "sonarDB"
  image:
    tag: 11.14.0
  persistence:
    enabled: true
    size: 20Gi

# ----------------------------------------------------------------------------
# 4. GENERAL SETTINGS
# ----------------------------------------------------------------------------
# Community Edition settings
community:
  enabled: true

# Persistence for SonarQube data (plugins, logs, etc)
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi

# Resource limits (Defaults from the chart are usually decent, but ensuring they are set)
resources:
  limits:
    cpu: 800m
    memory: 4096M
  requests:
    cpu: 400m
    memory: 2048M