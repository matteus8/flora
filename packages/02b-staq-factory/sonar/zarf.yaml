kind: ZarfPackageConfig
metadata:
  name: factory-sonarqube
  version: "###ZARF_PKG_TMPL_PACKAGE_VERSION###"
  description: "Code Quality & SAST"

variables:
  - name: PACKAGE_VERSION
    default: "0.0.1"

components:
  - name: sonarqube
    required: true
    manifests:
      - name: sonarqube-http-route
        namespace: sonarqube
        files:
          - ./manifests/httproute.yaml
    charts:
      - name: sonarqube
        url: https://SonarSource.github.io/helm-chart-sonarqube
        version: "2026.5.1003"
        namespace: sonarqube
        valuesFiles:
          - ./overrides/values.yaml
    images:
      - docker.io/library/sonarqube:26.9.0.129388-community
