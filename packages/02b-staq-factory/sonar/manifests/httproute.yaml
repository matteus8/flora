apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarqube-route
  namespace: sonarqube
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - sonarqube.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # The Helm chart defaults to "releaseName-chartName" for the service
        - name: sonarqube-sonarqube
          port: 9000