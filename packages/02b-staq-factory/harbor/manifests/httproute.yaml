apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-route
  namespace: harbor
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - harbor.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Routes to the main Harbor Portal/Core service
        - name: harbor
          port: 80