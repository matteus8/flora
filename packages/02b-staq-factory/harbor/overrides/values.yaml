# --- Minimal Harbor Configuration ---

# 1. External Access (Required for Docker Clients)
# This MUST match the Hostname in your httproute.yaml
externalURL: http://harbor.local

# 2. Network & Exposure
expose:
  # Disable default Ingress (We use Gateway API)
  type: clusterIP
  tls:
    enabled: false
  ingress:
    enabled: false

# 3. Persistence (Use PVCs)
persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      size: 10Gi
    chartmuseum:
      size: 5Gi
    jobservice:
      size: 1Gi
    database:
      size: 2Gi
    redis:
      size: 1Gi
    trivy:
      size: 5Gi

# 4. Component Tuning (Single Replica for Low Resources)
portal:
  replicas: 1
core:
  replicas: 1
jobservice:
  replicas: 1
registry:
  replicas: 1
trivy:
  enabled: true
  replicas: 1
notary:
  enabled: false # Deprecated & Heavy
chartmuseum:
  enabled: true
  replicas: 1

# 5. Database (Internal Postgres)
database:
  type: internal
  internal:
    password: "ChangeMe123!" # Required to set explicit password or use existing secret
postgresql:
  architecture: standalone # Disable HA
  primary:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

# 6. Cache (Internal Redis)
redis:
  type: internal
  internal:
    architecture: standalone # Disable HA
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 200m, memory: 256Mi }