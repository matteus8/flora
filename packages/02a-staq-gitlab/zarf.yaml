kind: ZarfPackageConfig
metadata:
  name: staq-gitlab
  version: "###ZARF_PKG_TMPL_PACKAGE_VERSION###"
  description: "Layer 1: Source Control and CI/CD (GitLab)"

variables:
  - name: PACKAGE_VERSION
    default: "0.0.1"

components:
  # -----------------------------------------------------
  # 1 GITLAB
  # -----------------------------------------------------
  - name: gitlab
    description: "GitLab infrastructure and its associated routing rule."
    required: true
    manifests:
      - name: gitlab-http-route
        namespace: gitlab
        files:
          - gitlab/manifests/httproute.yaml
    charts:
      - name: gitlab
        namespace: gitlab
        url: https://charts.gitlab.io/
        version: "9.11.14"
        valuesFiles:
          - gitlab/overrides/values.yaml
    images:
      - docker.io/bitnamilegacy/postgresql:16.6.0
      - docker.io/bitnamilegacy/redis:7.2.4-debian-12-r9
      - registry.gitlab.com/gitlab-org/build/cng/certificates:v18.11.13
      - registry.gitlab.com/gitlab-org/build/cng/cfssl-self-sign:v18.11.13
      - registry.gitlab.com/gitlab-org/build/cng/gitaly:v18.11.13
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-base:v18.11.13
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-container-registry:v4.39.0-gitlab
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-exporter:16.7.0
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-shell:v14.50.0
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-sidekiq-ce:v18.11.13
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-toolbox-ce:v18.11.13
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-webservice-ce:v18.11.13
