kind: ZarfPackageConfig
metadata:
  name: staq-gitlab
  version: "###ZARF_PKG_TMPL_PACKAGE_VERSION###"
  description: "Layer 1: Source Control and CI/CD (GitLab)"

variables:
  - name: PACKAGE_VERSION
    default: "0.0.1"

components:
  # -----------------------------------------------------
  # 1 GITLAB
  # -----------------------------------------------------
  - name: gitlab
    description: "GitLab infrastructure and its associated routing rule."
    required: true
    manifests:
      - name: gitlab-http-route
        namespace: gitlab
        files:
          - gitlab/manifests/httproute.yaml
    charts:
      - name: gitlab
        namespace: gitlab
        url: https://charts.gitlab.io/
        version: "9.5.0"
        valuesFiles:
          - gitlab/overrides/values.yaml
    images:
      - docker.io/bitnamilegacy/postgresql:16.6.0
      - docker.io/bitnamilegacy/redis:7.2.4-debian-12-r9
      - minio/mc:RELEASE.2018-07-13T00-53-22Z
      - minio/minio:RELEASE.2017-12-28T01-21-00Z
      - registry.gitlab.com/gitlab-org/build/cng/certificates:v18.5.0
      - registry.gitlab.com/gitlab-org/build/cng/cfssl-self-sign:v18.5.0
      - registry.gitlab.com/gitlab-org/build/cng/gitaly:v18.5.0
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-base:v18.5.0
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-container-registry:v4.27.0-gitlab
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-exporter:16.1.0
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-shell:v14.45.3
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-sidekiq-ce:v18.5.0
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-toolbox-ce:v18.5.0
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-webservice-ce:v18.5.0
      - registry.gitlab.com/gitlab-org/build/cng/gitlab-workhorse-ce:v18.5.0
      - registry.gitlab.com/gitlab-org/build/cng/kubectl:v18.5.0
      - registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v18.4.0
