# service.labels: object {} - Labels to add to the service
replicaCount: 1

image:
  repository: ollama/ollama
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 11434
  # -- Service node port when service type is 'NodePort'
  nodePort: 31434
  # -- Load Balancer IP address
  loadBalancerIP:
  annotations: {}
  labels: {}

ingress:
  enabled: false
  # For Kubernetes >= 1.18 you should specify the ingress Class
  # className: nginx
  # IngressClass that will be used to implement the Ingress (Kubernetes 1.18+)
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: ollama.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the
  # following lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

updateStrategy:
  # Deployment strategy can be "Recreate" or "RollingUpdate".
  # Default is Recreate
  type: Recreate

persistentVolume:
  enabled: false
  # If you'd like to bring your own PVC for persisting Ollama state,
  # pass the name of the created + ready PVC here.
  existingClaim: ""
  # Ollama server data Persistent Volume Storage Class
  # If defined, storageClassName: <storageClass>
  # If set to "-", storageClassName: "", which disables dynamic provisioning
  # If undefined (the default) or set to null, no storageClassName spec is
  #   set, choosing the default provisioner.  (gp2 on AWS, standard on
  #   GKE, AWS & OpenStack)
  #
  storageClass: ""
  # Ollama server data Persistent Volume access modes
  # Must be as quoted section
  accessModes:
    - ReadWriteOnce
  # Ollama server data Persistent Volume size
  size: 30Gi
  # Ollama server data Persistent Volume Binding Mode
  #
  volumeMode:
  # Pre-existing PV to attach this claim to
  volumeName: ""
  annotations: {}
  # Subdirectory of Ollama server data Persistent Volume to mount
  # Useful if the volume's root directory is not empty
  subPath: ""

extraObjects: []

extraArgs: []

extraEnv: []

extraEnvFrom: []

initContainers: []

volumes: []

volumeMounts: []

hostNetwork: false
hostPID: false
hostIPC: false

terminationGracePeriodSeconds: 120

deployment:
  labels: {}

livenessProbe:
  enabled: true
  path: "/"
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  path: "/"
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1

lifecycle: {}

priorityClassName: ""

runtimeClassName: ""

knative:
  enabled: false
  containerConcurrency: 0
  timeoutSeconds: 300
  responseStartTimeoutSeconds: 300
  idleTimeoutSeconds: 300
  annotations: {}

ollama:
  port: 11434
  # -- Override ollama-data volume mount path, default: "/root/.ollama"
  mountPath: ""
  # -- Add insecure flag for pulling at container startup
  insecure: false
  models:
    # -- List of models to pull at container startup
    pull: []
    # -- List of models to create at container startup
    create: []
    # -- List of models to load in memory at container startup
    run: []
    # -- Automatically remove models present on the disk but not specified in the values file
    clean: false
  gpu:
    # -- Enable GPU integration
    enabled: false
    # -- GPU type: 'nvidia' or 'amd'
    type: 'nvidia'
    # -- Specify the number of GPU
    number: 1
    # -- only for nvidia cards; change to (example) 'nvidia.com/mig-1g.10gb' to use MIG slice
    nvidiaResource: 'nvidia.com/gpu'
    mig:
      # -- Enable multiple mig devices
      enabled: false
      # -- Specify the mig devices and the corresponding number
      devices: {}
    dra:
      # -- Enable DRA GPU integration
      enabled: false
      # -- DRA GPU DriverClass
      draDriverClass: "gpu.nvidia.com"
      # -- Existing DRA GPU ResourceClaim Template
      draExistingClaimTemplate: ""

tests:
  enabled: true
  annotations: {}
  labels: {}

topologySpreadConstraints: {}