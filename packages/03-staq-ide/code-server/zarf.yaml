kind: ZarfPackageConfig
metadata:
  name: ide-code-server
  version: "###ZARF_PKG_TMPL_PACKAGE_VERSION###"
  description: "VS Code in the browser"

variables:
  - name: PACKAGE_VERSION
    default: "0.0.1"

components:
  - name: code-server
    required: true
    charts:
      - name: code-server
        namespace: code-server
        url: https://pascaliske.github.io/helm-charts
        version: "3.0.0"
        valuesFiles:
          - overrides/values.yaml # Path is now relative to this folder
    manifests:
      - name: code-server-httproute
        namespace: code-server
        files:
          - manifests/httproute.yaml
    images:
      - docker.io/library/busybox:latest
      - ghcr.io/coder/code-server:4.100.0
