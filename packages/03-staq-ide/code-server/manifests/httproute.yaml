apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: code-server-httproute
  namespace: code-server
spec:
  parentRefs:
    - name: main-gateway
      namespace: traefik
  hostnames:
  - "code-server.localhost"
  rules:
    - backendRefs:
        - name: code-server
          port: 8080
