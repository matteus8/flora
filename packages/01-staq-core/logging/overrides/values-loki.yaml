# --- DEPLOYMENT MODE ---
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  
  storage:
    type: 'filesystem'

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # --- COMPACTOR CONFIG (The Fix) ---
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    # The binary demands this line when retention is on:
    delete_request_store: filesystem 
  
  limits_config:
    retention_period: 168h # 7 Days

# --- COMPONENT RESOURCES ---
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

gateway:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

# --- DISABLE CACHES (CRITICAL) ---
# Your previous logs showed these pods starting. 
# We must ensure they are OFF to save 11GB RAM.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# --- DISABLE MICROSERVICES ---
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomGateway: { replicas: 0 }
bloomPlanner: { replicas: 0 }
bloomBuilder: { replicas: 0 }
patternIngester: { replicas: 0 }
ruler: { enabled: false }
minio: { enabled: false }
monitoring:
  selfMonitoring: { enabled: false }
  serviceMonitor: { enabled: false }
test: { enabled: false }