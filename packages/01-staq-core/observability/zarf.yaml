kind: ZarfPackageConfig
metadata:
  name: core-observability
  version: "###ZARF_PKG_TMPL_PACKAGE_VERSION###"
  description: "Module: Prometheus, Grafana, and AlertManager"

variables:
  - name: PACKAGE_VERSION
    default: "0.0.1"

components:
  # COMPONENT 1: Kube Prometheus Stack (Prometheus + Grafana + AlertManager)
  - name: kube-prometheus-stack
    description: "Deploys Prometheus, Grafana, and AlertManager via kube-prometheus-stack chart"
    required: true
    charts:
      - name: kube-prometheus-stack
        namespace: monitoring
        url: https://prometheus-community.github.io/helm-charts
        version: "92.14.1"
        valuesFiles:
          - overrides/values.yaml
    manifests:
      - name: observability-routes
        namespace: monitoring
        files:
          - manifests/httproute.yaml
    images:
      - docker.io/grafana/grafana:13.2.4-distroless
      - docker.io/library/busybox:1.38.0
      - ghcr.io/jkroepke/kube-webhook-certgen:1.11.0
      - quay.io/kiwigrid/k8s-sidecar:2.14.1
      - quay.io/prometheus-operator/prometheus-operator:v0.94.2
      - registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.2
      - quay.io/prometheus/alertmanager:v0.34.1
      - quay.io/prometheus/prometheus:v3.15.1-distroless
      - quay.io/thanos/thanos:v0.42.5
      - registry.k8s.io/kube-state-metrics/kube-state-metrics:sha256-42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b.sig
