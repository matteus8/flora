apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: observability-routes
  namespace: monitoring
spec:
  parentRefs:
    - name: main-gateway
      namespace: traefik # Assuming Traefik Gateway is in traefik namespace
  hostnames:
    - "grafana.localhost"
    - "prometheus.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /prometheus
      backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
