kind: ZarfPackageConfig
metadata:
  name: core-cert-manager
  version: "###ZARF_PKG_TMPL_PACKAGE_VERSION###"
  description: "Module: Cert Manager for TLS management"

variables:
  - name: PACKAGE_VERSION
    default: "0.0.1"

components:
  - name: cert-manager
    required: true
    description: "Cert Manager implementation"
    charts:
      - name: cert-manager
        namespace: cert-manager
        url: https://charts.jetstack.io
        version: "v1.19.2"
        valuesFiles:
          - overrides/values.yaml
    images:
      - quay.io/jetstack/cert-manager-cainjector:v1.19.2
      - quay.io/jetstack/cert-manager-controller:v1.19.2
      - quay.io/jetstack/cert-manager-startupapicheck:v1.19.2
      - quay.io/jetstack/cert-manager-webhook:v1.19.2
      # Possible images - cert-manager
      - quay.io/jetstack/cert-manager-acmesolver:v1.19.2
      # Cosign artifacts for images - cert-manager
      - quay.io/jetstack/cert-manager-cainjector:sha256-1a24f9848e7ae83a787187f4e75fdf5e9adf401f44de2f156c09c6fae1bf046e.sig
      - quay.io/jetstack/cert-manager-controller:sha256-d4ffb81a6d89a0e690ee80d07fcdcb6cccb99118010e3eb0808442e506e18ab0.sig
      - quay.io/jetstack/cert-manager-startupapicheck:sha256-677a064065a4809bb1efbd0f160d86fd07a37d72a4c2ec469dac62f663e6d610.sig
      - quay.io/jetstack/cert-manager-webhook:sha256-2ba4918d1581ed29bd5d68a017244560b353bcaf9932c814a8713887589bda6c.sig
      - quay.io/jetstack/cert-manager-acmesolver:sha256-cd353aa4ad8ec5dbcc64f454599611c8201a2b23f67720978140800999129b62.sig