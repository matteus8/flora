kind: ZarfPackageConfig
metadata:
  name: core-cert-manager
  version: "###ZARF_PKG_TMPL_PACKAGE_VERSION###"
  description: "Module: Cert Manager for TLS management"

variables:
  - name: PACKAGE_VERSION
    default: "0.0.1"

components:
  - name: cert-manager
    required: true
    description: "Cert Manager implementation"
    charts:
      - name: cert-manager
        namespace: cert-manager
        url: https://charts.jetstack.io
        version: "v1.21.3"
        valuesFiles:
          - overrides/values.yaml
    images:
      - quay.io/jetstack/cert-manager-cainjector:v1.21.3
      - quay.io/jetstack/cert-manager-controller:v1.21.3
      - quay.io/jetstack/cert-manager-startupapicheck:v1.21.3
      - quay.io/jetstack/cert-manager-webhook:v1.21.3
      - quay.io/jetstack/cert-manager-acmesolver:v1.21.3
      - quay.io/jetstack/cert-manager-cainjector:sha256-083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f.sig
      - quay.io/jetstack/cert-manager-controller:sha256-9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc.sig
      - quay.io/jetstack/cert-manager-startupapicheck:sha256-1c519d4afca1413d1e4ccd78bdc756184418ab55a34569a3b3de39d32f9974e1.sig
      - quay.io/jetstack/cert-manager-webhook:sha256-055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458.sig
      - quay.io/jetstack/cert-manager-acmesolver:sha256-c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7.sig
